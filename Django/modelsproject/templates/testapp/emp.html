<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="css/demo.css">
</head>
<body>
<h1>Employee view</h1>
{% if emp_list %}
<table border="3">
    <thead>
    <th>Eno</th>
    <th>Ename</th>
    <th>Esal</th>
    <th>Eaddr</th>
    </thead>
    {% for emp in emp_list %}
    <tr>
        <td>{{emp.eno}}</td>
        <td>{{emp.ename}}</td>
        <td>{{emp.esal}}</td>
        <td>{{emp.eaddr}}</td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p>No record Found</p>
{% endif %}
</body>
</html>
