<!DOCTYPE html>
{% extends 'testapp/base.html'%}
    {%block bodyblock%}
<h1>Emplyee Dashboard</h1>
<table border="3">
    <thead>
    <th>Employee Number</th>
    <th>Employee Name</th>
    <th>Employee Salary</th>
    <th>Employee address</th>
    </thead>
    {%for emp in emp_list%}
    <tr>
        <td>{{emp.eno}}</td>
        <td>{{emp.ename}}</td>
        <td>{{emp.esal}}</td>
        <td>{{emp.eaddr}}</td>
    </tr>
    {% endfor%}
</table>
    {% endblock %}
