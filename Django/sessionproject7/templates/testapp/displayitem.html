<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>The cart Items</h1>
{% if request.session %}
<table border="2">
<thead>
<th>Item name</th>
<th>quantity</th>
</thead>
    {% for key,val in request.session.items %}
    <tr>
        <td>{{key}}</td>
        <td>{{val}}</td>
    </tr>
    {% endfor %}
</table>
{% else%}
<p>No item </p>
{% endif %}
</body>
</html>
